  sat-b-nbiservice:
    cpus: 0.25
    image: tfs-migration/nbi:7.0.0-fb870787
    environment:
      LOG_LEVEL: INFO
      CONTEXTSERVICE_SERVICE_HOST: contextservice
      CONTEXTSERVICE_SERVICE_PORT_GRPC: '1010'
      DEVICESERVICE_SERVICE_HOST: deviceservice
      DEVICESERVICE_SERVICE_PORT_GRPC: '2020'
      SERVICESERVICE_SERVICE_HOST: serviceservice
      SERVICESERVICE_SERVICE_PORT_GRPC: '3030'
      PATHCOMPSERVICE_SERVICE_HOST: pathcompservice
      PATHCOMPSERVICE_SERVICE_PORT_GRPC: '10020'
      KFK_SERVER_ADDRESS: kafka:9092
      FLASK_ENV: production
      IETF_NETWORK_RENDERER: LIBYANG
    ports:
    - 127.0.0.1:18081:8080
    depends_on:
      sat-b-contextservice:
        condition: service_healthy
      sat-b-deviceservice:
        condition: service_healthy
      sat-b-serviceservice:
        condition: service_healthy
      sat-b-kafka:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz',
        timeout=5)
      interval: 10s
      timeout: 10s
      start_period: 60s
      retries: 30
    container_name: sat-b-nbiservice-1
    labels:
      org.teraflow.role: sat-b
    networks:
      sat-b:
        aliases:
        - nbiservice
  mininet:
    build:
      context: ..
      dockerfile: deploy/emulator.Dockerfile
      args:
        BMV2_IMAGE: ${BMV2_IMAGE:?Run prepare_lab.py first}
    image: tfs-migration/mininet:local
    privileged: true
    volumes:
    - ..:/experiment:ro
    - ../results/lab:/results
    command:
    - config/fixture.json
    ports:
    - 127.0.0.1:18090:8089
    networks:
      lab:
        ipv4_address: ${MININET_IP:-172.25.0.2}
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import json,urllib.request; s=json.load(urllib.request.urlopen('http://localhost:8089/',timeout=3));
        f=json.load(open('/experiment/config/fixture.json')); assert s['switch_count']==len(f['emulator']['devices'])
        and s['switches_alive']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
  p4-proxy:
    image: tfs-migration/device:7.0.0-fb870787
    entrypoint:
    - python
    - -m
    - src.p4_proxy
    - config/fixture.json
    working_dir: /experiment
    environment:
      PYTHONPATH: /experiment:/opt/tfs
      P4_STATE_DIRECTORY: /state
    volumes:
    - ..:/experiment:ro
    - proxy-state:/state
    ports:
    - 127.0.0.1:18091:8090
    depends_on:
      mininet:
        condition: service_healthy
    networks:
      lab:
        ipv4_address: ${P4_PROXY_IP:-172.25.0.3}
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8090/',timeout=3)
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
