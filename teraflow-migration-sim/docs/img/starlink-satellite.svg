<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Schema del satellite Starlink usato come riferimento del modello</title>
  <desc>Corpo piatto con 3 terminali laser, 5 antenne phased array in banda Ku, 3 antenne Ka/E, due pannelli solari, batteria, propulsore ad argon, inseguitore stellare e 4 ruote di reazione. Schema illustrativo, non in scala.</desc>
  <rect width="760" height="470" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2328">Satellite Starlink: componenti rilevanti per il modello</text>
  <text x="380" y="50" text-anchor="middle" font-size="12" fill="#57606a">Schema illustrativo, non in scala; posizioni dei componenti indicative</text>

  <!-- laser beams -->
  <g stroke="#c62828" stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="300" y1="92" x2="270" y2="66"/>
    <line x1="380" y1="92" x2="380" y2="62"/>
    <line x1="460" y1="92" x2="490" y2="66"/>
  </g>
  <!-- solar arrays + booms -->
  <g stroke="#0b3d91" stroke-width="1">
    <line x1="200" y1="200" x2="240" y2="200" stroke="#57606a" stroke-width="3"/>
    <line x1="520" y1="200" x2="560" y2="200" stroke="#57606a" stroke-width="3"/>
    <rect x="30" y="150" width="170" height="100" fill="#1d4e9e"/>
    <rect x="560" y="150" width="170" height="100" fill="#1d4e9e"/>
    <path d="M72 150V250M115 150V250M158 150V250M30 183H200M30 217H200" stroke="#8fb3ea"/>
    <path d="M602 150V250M645 150V250M688 150V250M560 183H730M560 217H730" stroke="#8fb3ea"/>
  </g>
  <!-- bus -->
  <rect x="240" y="110" width="280" height="180" rx="6" fill="#eef1f4" stroke="#57606a" stroke-width="1.5"/>
  <!-- laser terminals -->
  <g fill="#c62828"><rect x="290" y="92" width="20" height="18" rx="3"/><rect x="370" y="92" width="20" height="18" rx="3"/><rect x="450" y="92" width="20" height="18" rx="3"/></g>
  <!-- Ku phased arrays -->
  <g fill="#cfe3fb" stroke="#1565c0" stroke-width="1.2">
    <rect x="256" y="124" width="40" height="34"/><rect x="306" y="124" width="40" height="34"/><rect x="356" y="124" width="40" height="34"/><rect x="406" y="124" width="40" height="34"/><rect x="456" y="124" width="40" height="34"/>
  </g>
  <!-- Ka/E antennas -->
  <g fill="#ede7f6" stroke="#6a1b9a" stroke-width="1.2">
    <circle cx="300" cy="196" r="17"/><circle cx="380" cy="196" r="17"/><circle cx="460" cy="196" r="17"/>
  </g>
  <g fill="#6a1b9a"><circle cx="300" cy="196" r="3"/><circle cx="380" cy="196" r="3"/><circle cx="460" cy="196" r="3"/></g>
  <!-- internal: battery, reaction wheels, star tracker -->
  <rect x="330" y="232" width="70" height="38" fill="none" stroke="#2e7d32" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="365" y="256" text-anchor="middle" font-size="11" fill="#2e7d32">batteria</text>
  <g fill="none" stroke="#57606a" stroke-width="1.2" stroke-dasharray="3 3">
    <circle cx="425" cy="251" r="9"/><circle cx="449" cy="251" r="9"/><circle cx="473" cy="251" r="9"/><circle cx="497" cy="251" r="9"/>
  </g>
  <rect x="256" y="238" width="30" height="26" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
  <circle cx="271" cy="251" r="6" fill="none" stroke="#2e7d32"/>
  <!-- thruster -->
  <path d="M368 290h24l6 18h-36z" fill="#ef6c00"/>
  <g stroke="#ef6c00" stroke-width="1.5" stroke-dasharray="3 3"><line x1="372" y1="312" x2="366" y2="330"/><line x1="380" y1="312" x2="380" y2="332"/><line x1="388" y1="312" x2="394" y2="330"/></g>

  <!-- legend -->
  <g font-size="12" fill="#1f2328">
    <rect x="40" y="356" width="14" height="12" fill="#c62828"/><text x="62" y="367">3 laser spaziali (ISL ottici), fino a 200 Gbps</text>
    <rect x="40" y="380" width="14" height="12" fill="#cfe3fb" stroke="#1565c0"/><text x="62" y="391">5 antenne phased array in banda Ku (utenti)</text>
    <circle cx="47" cy="410" r="7" fill="#ede7f6" stroke="#6a1b9a"/><text x="62" y="415">3 antenne dual-band Ka / E</text>
    <rect x="40" y="428" width="14" height="12" fill="#1d4e9e"/><text x="62" y="439">2 pannelli solari + batteria ad alta capacità</text>
    <path d="M410 357h10l3 11h-16z" fill="#ef6c00"/><text x="432" y="367">propulsore elettrico ad argon</text>
    <rect x="408" y="380" width="14" height="12" fill="#e8f5e9" stroke="#2e7d32"/><text x="432" y="391">inseguitore stellare (assetto e posizione)</text>
    <circle cx="415" cy="410" r="6" fill="none" stroke="#57606a" stroke-dasharray="3 3"/><text x="432" y="415">4 ruote di reazione (una di scorta)</text>
    <text x="408" y="439" fill="#57606a">Corpo a pannello piatto, impilabile nel Falcon 9</text>
  </g>
</svg>
